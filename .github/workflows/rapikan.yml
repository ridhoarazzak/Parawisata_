name: Rapikan folder
on: workflow_dispatch
permissions:
  contents: write
jobs:
  rapikan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pindahkan file
        run: |
          set -e
          D=solsel-root/app/components/lib/data
          mkdir -p solsel-root/components solsel-root/lib solsel-root/data/raw
          git mv solsel-root/app/components/Explorer.tsx solsel-root/components/
          git mv solsel-root/app/components/Sprite.tsx solsel-root/components/
          git mv solsel-root/app/components/lib/places.ts solsel-root/lib/
          git mv $D/overrides.json solsel-root/data/
          git mv $D/places.json solsel-root/data/
          for f in aktivitas_warga kuliner penginapan wisata; do
            git mv $D/raw/$f.csv solsel-root/data/raw/
          done
          git mv $D/raw/.gitkeep solsel-root/data/raw/
          git config user.name "rapikan-bot"
          git config user.email "rapikan-bot@users.noreply.github.com"
          git commit -m "Rapikan struktur folder"
          git push
